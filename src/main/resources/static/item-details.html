<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Details — Campus Marketplace</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="uploads/demo/demo-calculator.jpg">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="site-logo">
        <div class="logo-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </div>
        <span>Campus Marketplace</span>
      </a>

      <nav class="site-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="browse.html" class="nav-link">Browse Items</a>
        <a href="sell.html" class="nav-link">Sell an Item</a>
        <a href="my-listings.html" id="nav-my-listings" class="nav-link" style="display:none;">My Listings</a>
      </nav>

      <div id="header-auth-section" class="header-auth"></div>

      <button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Toggle menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div id="mobile-drawer" class="mobile-nav-drawer">
      <a href="index.html" class="nav-link">Home</a>
      <a href="browse.html" class="nav-link">Browse Items</a>
      <a href="sell.html" class="nav-link">Sell an Item</a>
      <a href="my-listings.html" class="nav-link">My Listings</a>
      <div id="mobile-auth-section"></div>
    </div>
  </header>

  <!-- Item Details Content -->
  <main class="section-container" style="padding-top:1.5rem;">
    <a href="browse.html" style="display:inline-flex;align-items:center;gap:0.4rem;font-size:0.875rem;color:var(--text-muted);margin-bottom:1.25rem;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      Back to items
    </a>

    <div id="item-details-container">
      <p style="text-align:center;padding:3rem;color:var(--text-muted);">Loading item details…</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-content">
      <div><strong>Campus Circular Market</strong> &bull; College Java Mini-Project</div>
      <div>Built with HTML5, CSS3, Vanilla JavaScript, Spring Boot & MySQL</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function loadItem() {
      const container = document.getElementById('item-details-container');
      const params = new URLSearchParams(window.location.search);
      const itemId = params.get('id');

      if (!itemId) {
        container.innerHTML = `
          <div style="text-align:center;padding:4rem;">
            <h2>No listing specified</h2>
            <a href="browse.html" class="btn btn-primary" style="margin-top:1rem;">Back to Browse</a>
          </div>
        `;
        return;
      }

      // Check current user auth
      await checkAuthStatus();

      try {
        const item = await api.get(`/items/${itemId}`);
        if (!item) throw new Error('Listing not found');

        const isEmail = item.sellerContact && item.sellerContact.includes('@');
        const isSold = item.status === 'SOLD';

        // Contact Section Logic
        let contactHtml = '';
        if (isSold) {
          contactHtml = `
            <div class="contact-card">
              <h3>Contact seller</h3>
              <p style="font-size:0.875rem;color:var(--text-muted);">This item has been sold and is no longer available.</p>
            </div>
          `;
        } else if (!currentUser) {
          contactHtml = `
            <div class="contact-card">
              <h3>Contact seller</h3>
              <p style="font-size:0.875rem;color:var(--text-muted);margin-bottom:0.85rem;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px;">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                Sign in to view the seller's verified contact details.
              </p>
              <a href="auth.html?redirect=item-details.html?id=${item.itemId}" class="btn btn-primary btn-sm">Sign in to contact</a>
            </div>
          `;
        } else {
          contactHtml = `
            <div class="contact-card">
              <h3>Contact seller</h3>
              <p style="font-size:0.95rem;font-weight:600;color:var(--text-main);margin-bottom:0.75rem;">
                ${escapeHtml(item.sellerContact)}
              </p>
              ${isEmail ? `
                <a href="mailto:${encodeURIComponent(item.sellerContact)}?subject=${encodeURIComponent('Campus Marketplace: ' + item.itemName)}" class="btn btn-accent btn-sm">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                  Email Seller
                </a>
              ` : `
                <a href="tel:${escapeHtml(item.sellerContact.replace(/[^0-9+]/g, ''))}" class="btn btn-accent btn-sm">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                  Call Seller
                </a>
              `}
            </div>
          `;
        }

        // Owner/Admin Management bar
        let ownerActionsHtml = '';
        if (item.canEdit) {
          ownerActionsHtml = `
            <div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;margin-top:1.5rem;display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;">
              <span style="font-size:0.8125rem;font-weight:700;color:var(--primary);margin-right:auto;">Listing Actions:</span>
              <a href="edit.html?id=${item.itemId}" class="btn btn-outline btn-sm">Edit</a>
              <button class="btn btn-outline btn-sm" onclick="toggleStatus(${item.itemId}, '${item.status === 'AVAILABLE' ? 'SOLD' : 'AVAILABLE'}')">
                ${item.status === 'AVAILABLE' ? 'Mark as sold' : 'Mark as available'}
              </button>
              <button class="btn btn-danger btn-sm" onclick="confirmDelete(${item.itemId})">Delete</button>
            </div>
          `;
        }

        container.innerHTML = `
          <div class="details-grid">
            <div class="details-image-box">
              <img src="${item.imageUrl || 'uploads/demo/demo-textbook.jpg'}" alt="${escapeHtml(item.itemName)}" class="details-image" onerror="this.src='uploads/demo/demo-textbook.jpg'">
            </div>
            <div class="details-info-box">
              <div style="display:flex;gap:0.5rem;align-items:center;">
                ${item.status === 'SOLD' ? '<span class="badge badge-sold">Sold</span>' : '<span class="badge badge-available">Available</span>'}
                ${item.demo ? '<span class="badge badge-demo">Demo listing — not a real offer</span>' : ''}
              </div>

              <h1>${escapeHtml(item.itemName)}</h1>
              <p class="details-price">${formatPrice(item.price)}</p>

              <div class="meta-list">
                <div class="meta-item">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>
                  <span>Category:</span>
                  <a href="browse.html?category=${encodeURIComponent(item.category)}" class="value" style="color:var(--accent);text-decoration:underline;">${escapeHtml(item.category)}</a>
                </div>
                <div class="meta-item">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  <span>Seller:</span>
                  <span class="value">${escapeHtml(item.sellerName)}</span>
                </div>
                <div class="meta-item">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                  <span>Listed:</span>
                  <span class="value">${formatDate(item.createdAt)}</span>
                </div>
              </div>

              <h2 class="desc-heading">Description</h2>
              <p class="desc-text">${escapeHtml(item.description)}</p>

              ${contactHtml}
              ${ownerActionsHtml}
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `
          <div style="text-align:center;padding:4rem;background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border);">
            <h2 style="font-size:1.25rem;font-weight:700;color:var(--text-main);">Listing not found</h2>
            <p style="color:var(--text-muted);margin-top:0.25rem;">This item may have been removed or deleted.</p>
            <a href="browse.html" class="btn btn-outline" style="margin-top:1.25rem;">Back to Browse</a>
          </div>
        `;
      }
    }

    async function toggleStatus(id, newStatus) {
      try {
        await api.patch(`/items/${id}/status`, { status: newStatus });
        showToast(newStatus === 'SOLD' ? 'Marked as sold' : 'Marked as available', 'success');
        loadItem();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function confirmDelete(id) {
      if (!confirm('Are you sure you want to delete this listing? This action cannot be undone.')) {
        return;
      }
      try {
        await api.delete(`/items/${id}`);
        showToast('Listing deleted successfully', 'success');
        setTimeout(() => {
          window.location.href = 'browse.html';
        }, 500);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadItem);
  </script>
</body>
</html>
