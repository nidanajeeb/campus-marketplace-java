<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Listings — Campus Marketplace</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="uploads/demo/demo-calculator.jpg">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="site-logo">
        <div class="logo-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </div>
        <span>Campus Marketplace</span>
      </a>

      <nav class="site-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="browse.html" class="nav-link">Browse Items</a>
        <a href="sell.html" class="nav-link">Sell an Item</a>
        <a href="my-listings.html" id="nav-my-listings" class="nav-link active">My Listings</a>
      </nav>

      <div id="header-auth-section" class="header-auth"></div>

      <button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Toggle menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div id="mobile-drawer" class="mobile-nav-drawer">
      <a href="index.html" class="nav-link">Home</a>
      <a href="browse.html" class="nav-link">Browse Items</a>
      <a href="sell.html" class="nav-link">Sell an Item</a>
      <a href="my-listings.html" class="nav-link active">My Listings</a>
      <div id="mobile-auth-section"></div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="section-container" style="padding-top:2rem;max-width:1000px;">
    <div id="my-listings-header" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1.5rem;">
      <div>
        <h1 id="page-title" style="font-size:1.75rem;font-weight:800;color:var(--text-main);">My Listings</h1>
        <p id="user-info" style="color:var(--text-muted);font-size:0.875rem;">Loading account…</p>
      </div>
      <div id="header-actions" style="display:flex;gap:0.5rem;flex-wrap:wrap;">
        <a href="sell.html" class="btn btn-accent btn-sm">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
          New listing
        </a>
      </div>
    </div>

    <!-- Items List Container -->
    <div id="listings-list" style="display:grid;gap:1rem;">
      <p style="text-align:center;padding:3rem;color:var(--text-muted);">Loading your listings…</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-content">
      <div><strong>Campus Circular Market</strong> &bull; College Java Mini-Project</div>
      <div>Built with HTML5, CSS3, Vanilla JavaScript, Spring Boot & MySQL</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function loadListings() {
      const user = await checkAuthStatus();
      if (!user) {
        window.location.href = 'auth.html?redirect=my-listings.html';
        return;
      }

      const titleEl = document.getElementById('page-title');
      const userEl = document.getElementById('user-info');
      const actionsEl = document.getElementById('header-actions');
      const listEl = document.getElementById('listings-list');

      const isAdmin = user.role === 'ROLE_ADMIN';
      if (isAdmin) {
        titleEl.textContent = 'All Listings Management (Admin)';
        userEl.innerHTML = `Administrator: <strong>${escapeHtml(user.email)}</strong> &bull; You have full access to manage all campus listings.`;
        
        // Add Reset Demo Data button for Admin
        if (!document.getElementById('btn-reset-demo')) {
          const resetBtn = document.createElement('button');
          resetBtn.id = 'btn-reset-demo';
          resetBtn.className = 'btn btn-outline btn-sm';
          resetBtn.innerHTML = `
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Reset Demo Data
          `;
          resetBtn.onclick = handleResetDemo;
          actionsEl.appendChild(resetBtn);
        }
      } else {
        titleEl.textContent = 'My Listings';
        userEl.textContent = `Signed in as ${user.email}`;
      }

      try {
        const items = await api.get('/items/my-listings');

        if (!items || items.length === 0) {
          listEl.innerHTML = `
            <div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:3rem 1.5rem;text-align:center;">
              <h3 style="font-size:1.15rem;font-weight:700;color:var(--text-main);">You haven't listed anything yet</h3>
              <p style="color:var(--text-muted);font-size:0.875rem;margin-top:0.25rem;">Turn last semester's books, calculators and supplies into cash.</p>
              <a href="sell.html" class="btn btn-accent btn-sm" style="margin-top:1.25rem;">Sell an Item</a>
            </div>
          `;
          return;
        }

        listEl.innerHTML = items.map(item => `
          <div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;display:flex;flex-wrap:wrap;align-items:center;gap:1.25rem;box-shadow:var(--shadow-sm);">
            <!-- Thumbnail -->
            <a href="item-details.html?id=${item.itemId}" style="width:72px;height:72px;border-radius:var(--radius-md);overflow:hidden;background:#f1f5f9;flex-shrink:0;">
              <img src="${item.imageUrl || 'uploads/demo/demo-textbook.jpg'}" alt="${escapeHtml(item.itemName)}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='uploads/demo/demo-textbook.jpg'">
            </a>

            <!-- Info -->
            <div style="flex:1;min-width:200px;">
              <div style="display:flex;align-items:center;gap:0.5rem;font-size:0.75rem;color:var(--text-muted);margin-bottom:0.2rem;">
                ${item.status === 'SOLD' ? '<span class="badge badge-sold">Sold</span>' : '<span class="badge badge-available">Available</span>'}
                <span>${escapeHtml(item.category)} &bull; Listed ${formatDate(item.createdAt)}</span>
              </div>
              <a href="item-details.html?id=${item.itemId}" style="font-size:1rem;font-weight:700;color:var(--text-main);display:block;">
                ${escapeHtml(item.itemName)}
              </a>
              <p style="font-weight:700;color:var(--primary);margin-top:0.25rem;">${formatPrice(item.price)}</p>
            </div>

            <!-- Action buttons -->
            <div style="display:flex;gap:0.4rem;flex-wrap:wrap;">
              <a href="edit.html?id=${item.itemId}" class="btn btn-outline btn-sm">Edit</a>
              <button class="btn btn-outline btn-sm" onclick="toggleItemStatus(${item.itemId}, '${item.status === 'AVAILABLE' ? 'SOLD' : 'AVAILABLE'}')">
                ${item.status === 'AVAILABLE' ? 'Mark as sold' : 'Mark as available'}
              </button>
              <button class="btn btn-danger btn-sm" onclick="deleteListing(${item.itemId})">Delete</button>
            </div>
          </div>
        `).join('');

      } catch (err) {
        listEl.innerHTML = `
          <div style="padding:2rem;text-align:center;color:#ef4444;background:#fee2e2;border-radius:var(--radius-md);">
            Could not load listings. ${escapeHtml(err.message)}
          </div>
        `;
      }
    }

    async function toggleItemStatus(id, newStatus) {
      try {
        await api.patch(`/items/${id}/status`, { status: newStatus });
        showToast(newStatus === 'SOLD' ? 'Marked as sold' : 'Marked as available', 'success');
        loadListings();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function deleteListing(id) {
      if (!confirm('Are you sure you want to permanently delete this listing?')) {
        return;
      }
      try {
        await api.delete(`/items/${id}`);
        showToast('Listing deleted successfully', 'success');
        loadListings();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function handleResetDemo() {
      if (!confirm('This will restore the 8 default demonstration listings. Continue?')) {
        return;
      }
      try {
        await api.post('/admin/reset-demo');
        showToast('Demo listings restored successfully!', 'success');
        loadListings();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadListings);
  </script>
</body>
</html>
