# ========================================================
# Campus Circular Market - Application Configuration
# ========================================================

server.port=8081

# --------------------------------------------------------
# 1. MySQL Database Configuration
# --------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/campus_market_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Nida123#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------------------
# 2. JPA / Hibernate Configuration
# --------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# --------------------------------------------------------
# 3. File Upload Configuration
# --------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom directory for user-uploaded product images
app.upload.dir=./uploads

# --------------------------------------------------------
# 4. Static Resources Serving
# --------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

